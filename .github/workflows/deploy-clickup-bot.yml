name: Deploy ClickUp Bot Lambda

# Only clickup-bot-prod exists (there is no clickup-bot-dev Lambda and no
# dev/qa terraform environment for it), so this workflow deploys prod only.
# If a dev environment is ever created, add its branch and function here.
on:
  push:
    branches:
      - prod
    paths:
      - 'clickup_bot/**'
      - '.github/workflows/deploy-clickup-bot.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  FUNCTION_NAME: clickup-bot-prod

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run clickup_bot tests
        run: uv run pytest clickup_bot/tests/ -v

  deploy:
    name: Deploy Lambda
    needs: test
    # Only code from the prod branch may reach clickup-bot-prod. Without this
    # guard, a workflow_dispatch from any branch (the GitHub UI defaults to
    # develop) would zip that branch's handler and silently replace prod code
    # that terraform deliberately no longer tracks (lifecycle.ignore_changes).
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-lambda-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and deploy Lambda
        run: |
          cd clickup_bot/lambda
          zip -j /tmp/clickup-bot-lambda.zip handler.py

          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --zip-file fileb:///tmp/clickup-bot-lambda.zip \
            --region ${{ env.AWS_REGION }}

      # update-function-code returns as soon as Lambda ACCEPTS the request;
      # without waiting, a failed update (corrupt zip, bad handler) exits 0
      # and CI shows green while prod is broken.
      - name: Wait for update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}
          echo "Deployed ${{ env.FUNCTION_NAME }}"
